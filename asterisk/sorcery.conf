; sorcery.conf — DeskcommCRM / SomaFlow
;
; De onde o PJSIP lê os objetos do tronco SIP. Duas fontes, NESTA ordem:
;
;   1. `pjsip.conf` (config) — o arquivo, como sempre foi. Quem escreveu o
;      tronco à mão segue funcionando, e o transporte (IP público, porta) mora
;      aqui, porque transporte não se cria em tempo de execução.
;   2. astdb — o banco interno do Asterisk, no volume `asterisk-data`. É onde a
;      tela "Trunk SIP" grava o tronco de cada organização, pela ARI
;      (lib/voip/tronco-no-asterisk.ts), sem editar arquivo e sem reiniciar.
;
; Os nomes dos objetos da tela são `org-<uuid>-trunk-*`; não use esse padrão no
; pjsip.conf, ou o arquivo vence e a tela deixa de mandar.

[res_pjsip]
endpoint = config,pjsip.conf,criteria=type=endpoint
endpoint = astdb,ps_endpoint
aor = config,pjsip.conf,criteria=type=aor
aor = astdb,ps_aor
auth = config,pjsip.conf,criteria=type=auth
auth = astdb,ps_auth
identify = config,pjsip.conf,criteria=type=identify
identify = astdb,ps_identify
registration = config,pjsip.conf,criteria=type=registration
registration = astdb,ps_registration

[res_pjsip_endpoint_identifier_ip]
identify = config,pjsip.conf,criteria=type=identify
identify = astdb,ps_identify
