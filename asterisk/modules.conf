; modules.conf — DeskcommCRM / SomaFlow
;
; O `modules.conf` da imagem carrega TUDO (autoload=yes). Com tudo, o PJSIP
; estoura o limite de módulos do pjproject ("Too many modules registered!") e o
; `res_pjsip_nat` fica de fora — medido no Asterisk 20.20.1 da imagem do
; compose. Sem ele, o Asterisk atrás do NAT do Docker anuncia o IP interno do
; contêiner: o registro no provedor oscila e a voz pode não voltar.
;
; Mantém o autoload e os `noload` da imagem, e desliga o que a telefonia daqui
; não usa (presença, correio de voz por SIP, websocket, fax, STIR/SHAKEN...).
; Conferido depois desta lista: zero erro de módulo, e `res_pjsip_nat`,
; `res_pjsip_outbound_registration`, `res_sorcery_astdb`, `res_audiosocket`,
; `chan_audiosocket` e a ARI carregados.

[modules]
autoload = yes

; os da imagem
noload = chan_alsa.so
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so
noload = chan_sip.so
noload = app_voicemail_imap.so
noload = app_voicemail_odbc.so

; PJSIP só com o que a telefonia usa
noload = res_pjsip_phoneprov_provider.so
noload = res_phoneprov.so
noload = res_pjsip_publish_asterisk.so
noload = res_pjsip_outbound_publish.so
noload = res_pjsip_exten_state.so
noload = res_pjsip_mwi.so
noload = res_pjsip_mwi_body_generator.so
noload = res_pjsip_pidf_body_generator.so
noload = res_pjsip_xpidf_body_generator.so
noload = res_pjsip_pidf_digium_body_supplement.so
noload = res_pjsip_pidf_eyebeam_body_supplement.so
noload = res_pjsip_dialog_info_body_generator.so
noload = res_pjsip_send_to_voicemail.so
noload = res_pjsip_transport_websocket.so
noload = res_pjsip_stir_shaken.so
noload = res_pjsip_geolocation.so
noload = res_pjsip_history.so
noload = res_pjsip_t38.so
noload = res_pjsip_messaging.so
noload = res_pjsip_aoc.so
noload = res_pjsip_rfc3329.so
noload = chan_websocket.so
